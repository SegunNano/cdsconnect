name: Sync Production

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to production
        run: |
          git remote add production https://x-access-token:${{ secrets.PROD_REPO_TOKEN }}@github.com/infotechnysclagos/cdsconnect.git
          git push production main
